# Force Node.js detection and prevent Deno detection
[app]
name = "social-media-scheduler"

[build]
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-22_x", "npm-10_x"]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[phases.start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
PORT = "3000"

# Explicitly prevent Deno detection
[build.env]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_NPM_VERSION = "10"