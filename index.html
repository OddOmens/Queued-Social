<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Odd Omens Scheduler</title>
    <meta name="description" content="Internal social media scheduling and management tool for Odd Omens" />
    <meta name="keywords" content="social media, scheduler, posts, automation, threads, linkedin, instagram" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scheduler" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Odd Omens Scheduler" />
    <meta property="og:description" content="Internal social media scheduling and management tool" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Odd Omens Scheduler" />
    <meta property="twitter:description" content="Internal social media scheduling and management tool" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="color-scheme" content="dark light" />
  </head>

    <div id="root"></div>
