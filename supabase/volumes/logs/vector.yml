api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - supabase-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |
      .project = "default"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_id)
      del(.host)
      del(.source_type)
      del(.stream)
      del(.label)

  router:
    type: route
    inputs:
      - project_logs
    route:
      kong: '.appname == "supabase-kong"'
      auth: '.appname == "supabase-auth"'
      rest: '.appname == "supabase-rest"'
      realtime: '.appname == "supabase-realtime"'
      storage: '.appname == "supabase-storage"'
      functions: '.appname == "supabase-functions"'
      db: '.appname == "supabase-db"'

sinks:
  logflare_kong:
    type: http
    inputs:
      - router.kong
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=edge.logs.kong-requests

  logflare_auth:
    type: http
    inputs:
      - router.auth
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=gotrue.logs

  logflare_rest:
    type: http
    inputs:
      - router.rest
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=postgrest.logs

  logflare_realtime:
    type: http
    inputs:
      - router.realtime
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=realtime.logs

  logflare_storage:
    type: http
    inputs:
      - router.storage
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=storage.logs

  logflare_functions:
    type: http
    inputs:
      - router.functions
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=edge.logs.functions

  logflare_db:
    type: http
    inputs:
      - router.db
    encoding:
      codec: json
    method: post
    request:
      headers:
        x-api-key: "${LOGFLARE_API_KEY}"
    uri: http://analytics:4000/api/logs?source_name=postgres.logs
